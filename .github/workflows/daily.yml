name: Gmarket Best 100 Telegram

on:
  workflow_dispatch:
  schedule:
    # 매일 오전 9시 5분, 한국 시간. 정각보다 약간 늦춰 지연 가능성을 줄입니다.
    - cron: "5 9 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: read

jobs:
  send-best100:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Collect Gmarket Best and send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gmarket_best100.py
